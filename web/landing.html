<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08080a">
<title>每一张，都出众。</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/hd.css">
<link rel="stylesheet" href="/static/motion.css">
<link rel="stylesheet" href="/static/ai-water.css">
<script defer src="/static/ai-orbit.js"></script>
  <link rel="stylesheet" href="/static/ai-orbit-glow.css">
  <style id="preview-framing">.ai-water-card video[src$="/static/assets/motion/orbit/window.mp4"],.ai-water-card video[src$="/static/assets/motion/orbit/box.mp4"],.ai-water-card video[src$="/static/assets/motion/orbit/sand.mp4"],.ai-water-card video[src$="/static/assets/motion/orbit/silk.mp4"],.ai-water-card video[src$="/showcase-media/window-tight.mp4"],.ai-water-card video[src$="/showcase-media/box-tight.mp4"],.ai-water-card video[src$="/showcase-media/sand-tight.mp4"],.ai-water-card video[src$="/showcase-media/silk-tight.mp4"]{object-fit:contain;background:#211e25}</style>
  <style id="preview-macro-position">.ai-water-card video[src$="/orbit/macro.mp4"]{object-position:right center}</style>
</head>
<body data-local-clips="{{LOCAL_CLIPS}}">
<div class="page">
<header class="top">
  <div class="navwrap">
    <a class="mark" href="#top" aria-label="返回落地页顶部"><img src="/static/assets/mark.png" alt="" width="28" height="25"></a>
    <nav aria-label="主导航">
      <a href="/library">产品库</a><a href="/plan">套图计划</a><a href="/review">审核</a><a href="/export">导出</a><a href="/settings">设置</a>
    </nav>
  </div>
</header>
<main id="top">
  <section class="hero" data-motion="hero" aria-labelledby="title">
    <div class="orbit-ambient" aria-hidden="true"></div>
    <img class="art" src="/static/assets/hd/hero.webp" alt="五张无品牌产品摄影海报，橙光从左上斜穿，靛蓝从右侧与下方照亮五张套图。" width="1302" height="1208" fetchpriority="high">
    <div class="hero-copy">
      <h1 id="title">每一张，都出众。</h1>
      <div class="actions">
        <a class="button primary" href="/library#drop-area">开始制作</a>
        <a class="button secondary" href="#examples">查看示例</a>
      </div>
    </div>
  </section>
  <section class="examples" data-motion="examples" id="examples" aria-labelledby="example-title">
    <div class="orbit-ambient" aria-hidden="true"></div>
    <img class="art" src="/static/assets/hd/examples-field.webp" alt="" width="946" height="331">
    <img class="scene-strip" src="/static/assets/hd/scenes.webp" alt="同一件产品的三张摄影示例：暖色岩面、水波、柔软缎面。" width="2170" height="487">
    <h2 class="example-title" id="example-title">从首图到场景，保持同一种表达。</h2>
  </section>
  <section class="features" data-motion="features" aria-label="核对与导出">
    <div class="orbit-ambient" aria-hidden="true"></div>
    <img class="art" src="/static/assets/hd/details.webp" alt="左边是瓶盖放大细节，右边是成套主副图。" width="1890" height="832">
    <p class="caption review">把细节，留给每一次认真核对。</p>
    <p class="caption export">主副图与导入表，一次整理。</p>
  </section>
<footer class="showcase-note">首页展示图片与视频为 AI 创作示例。</footer>
</main>
</div>
</body>
</html>
