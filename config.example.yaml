# 复制成 config.yaml 再改（设置页保存时会自动生成 config.yaml）。
# 永远不要把 API key 写在这里：它只从环境变量 OPENAI_API_KEY 读取。
workspace: ./workspace
demo_mode: false                  # true = 不调用 OpenAI、不花钱，出占位图（熟悉流程用）
budget_usd_per_day: 10
concurrency: 6
generation:
  model: gpt-image-2.5-flare
  quality: medium
  size: 1024x1024
  route_label_heavy: false        # 第二轮实测：flare + 标签原文块即可；sunburst 只用于修复
  label_heavy_model: gpt-image-2.5-sunburst
text_model: auto                  # 识别标签、做计划用的文本/视觉模型；auto = 优先选兼容图片识别与结构化结果的模型
est_usd_per_image: 0.026          # 只用于预估（实测 2.5-flare medium）
pricing_usd_per_million_tokens:   # 出图单价，OpenAI 改价时更新
  text_input: 5
  image_input: 8
  image_output: 30
text_pricing_usd_per_million_tokens:  # 文本模型单价；0 = 不计入预算
  input: 0
  output: 0
faces:
  allow_full_face: false          # 所有类目都允许完整人脸
  categories: [mask]              # 只在这些类目的场景图允许人脸（第二轮结论：先开面膜）
repair:
  label_paste_always: true        # 能贴就把原标签贴回去
  max_attempts_per_slot: 3
export_jpg_quality: 92
