# Copy to config.yaml and edit. Never put the API key here: it is read from OPENAI_API_KEY.
workspace: ./workspace
budget_usd_per_day: 10
concurrency: 6
generation:
  model: gpt-image-2.5-flare
  label_heavy_model: gpt-image-2.5-sunburst   # SKUs with many small label lines or known misspellings
  quality: medium
  size: 1024x1024
pricing_usd_per_million_tokens:   # update if OpenAI changes prices
  text_input: 5
  image_input: 8
  image_output: 30
faces:
  allow_full_face: false          # switch on per category after testing
repair:
  label_paste_always: true        # paste the original label back whenever geometry allows
  max_attempts_per_slot: 3
